name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time; a newer push replaces any queued (not running)
# run. Running jobs finish, so rust-cache can save and later runs start warm.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (primary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: miso-terminal-windows-x64
          path: target/release/miso-terminal.exe

  linux-core:
    # The data, MISO and theme layers are platform-neutral; keep them that way.
    name: Linux (non-UI crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mt-core -p mt-data -p mt-miso -p mt-nws -p mt-theme
