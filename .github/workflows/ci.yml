name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time; a newer push replaces any queued (not running)
# run. Running jobs finish, so rust-cache can save and later runs start warm.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every build is --locked: a pull request that changes Cargo.toml must commit
# the matching Cargo.lock. The compiler is the one rust-toolchain.toml pins.
jobs:
  windows:
    name: Windows (primary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: miso-terminal-windows-x64
          path: target/release/miso-terminal.exe

  linux-core:
    # The data, source and theme layers are platform-neutral; keep them that way.
    name: Linux (non-UI crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p mt-core -p mt-data -p mt-miso -p mt-nws -p mt-eia -p mt-news -p mt-alpaca -p mt-theme
      # The release zip's third-party notices: a dependency under a licence
      # packaging/about.toml does not accept fails here, not at release time.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate --locked -c packaging/about.toml -o "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html" packaging/about.hbs

  docs:
    # The documentation site, built as docs.yml deploys it; a broken page,
    # link or anchor fails the build.
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag
      - run: uv run tools/build_docs.py "$RUNNER_TEMP/site"
