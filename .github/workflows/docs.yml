name: Docs

# Builds the documentation site from the repository's Markdown
# (tools/build_docs.py) and deploys it to GitHub Pages from main. Pull
# requests build it too, in ci.yml's Docs job (a required check).
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - themes/**
      - tools/build_docs.py
      - tools/docs_style.css
      - assets/fonts/**
      - assets/icon/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag
      - run: uv run tools/build_docs.py site
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
