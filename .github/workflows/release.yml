name: Release

# A tag like v0.2.0 builds the Windows zip and publishes it as a GitHub
# release; a tag with a pre-release part (v0.2.0-rc.1) publishes a
# pre-release. The tag must equal the workspace version. The release carries
# the zip, SHA256SUMS.txt, a build provenance attestation and notes from
# CHANGELOG.md (tools/release_notes.py), and the zip carries the third-party
# notices. With immutable releases on, it is drafted, filled, then published.
#
# Pull requests that change the release's files, and a run by hand, build
# everything the same way as a dry run and publish nothing: a test tag here
# could never be deleted.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release_notes.py
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the tests and the build scripts, so it gets no write access.
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Version (a tag must match it)
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'miso-terminal').version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              Write-Output "::error::The tag $env:GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml."
              exit 1
            }
            $name = "miso-terminal-$version-windows-x64"
          } else {
            $name = 'miso-terminal-dry-run-windows-x64'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
      # A release builds from scratch; a dry run may start warm.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
        env:
          # The plain version; any other build adds its commit (build.rs).
          MT_RELEASE: ${{ github.ref_type == 'tag' && '1' || '' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: cargo about generate --locked -c packaging/about.toml -o THIRD-PARTY-NOTICES.html packaging/about.hbs
      - name: Package
        shell: pwsh
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          $dir = $env:NAME
          New-Item -ItemType Directory $dir, "$dir/licenses" | Out-Null
          Copy-Item target/release/miso-terminal.exe, README.md, CHANGELOG.md, LICENSE, THIRD-PARTY-NOTICES.html, packaging/install.ps1 $dir
          Copy-Item -Recurse fixtures "$dir/fixtures"   # recorded data for --offline
          Remove-Item -Recurse "$dir/fixtures/compat"    # test data, not for --offline
          Copy-Item assets/fonts/*-OFL.txt "$dir/licenses"
          # Windows' own bsdtar: Compress-Archive (and .NET Framework's
          # ZipFile) write backslashes as path separators, which other unzip
          # tools mishandle. (On the runner, `tar` alone would be Git's.)
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "$dir.zip" $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          # sha256sum's format (two spaces, LF), so `sha256sum -c` works too.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", "$hash  $dir.zip`n")
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag
      - name: Notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run tools/release_notes.py "$VERSION" --zip "$NAME.zip" > notes.md
          else
            uv run tools/release_notes.py "$VERSION" --section Unreleased --zip "$NAME.zip" > notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ steps.version.outputs.name }}.zip
            SHA256SUMS.txt
            notes.md
          if-no-files-found: error

  # Tags only: attest the zip and publish. The only job that can write.
  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the release
      id-token: write      # signing the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ needs.build.outputs.name }}.zip
      - name: Draft, attach, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --draft "${pre[@]}" \
            --title "MISO Terminal $VERSION" --notes-file notes.md \
            "$NAME.zip" SHA256SUMS.txt
          gh release edit "$TAG" --draft=false
