name: Release

# Push a tag like v0.2.0 to build a Windows zip and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $dir = "miso-terminal-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/miso-terminal.exe $dir
          Copy-Item -Recurse fixtures $dir/fixtures          # enables --offline
          Copy-Item README.md $dir
          Copy-Item packaging/install.ps1 $dir
          New-Item -ItemType Directory $dir/licenses | Out-Null
          Copy-Item assets/fonts/*-OFL.txt $dir/licenses
          Compress-Archive $dir "$dir.zip"
      - uses: softprops/action-gh-release@v3
        with:
          files: miso-terminal-*-windows-x64.zip
          generate_release_notes: true
