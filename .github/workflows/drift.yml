name: MISO format drift

# Weekly: record live MISO responses (and the weather, gas, news and Alpaca
# sources) and run every parser against them, so a format change or a feed that
# moved shows up here before it shows up as a blank panel. One request per
# endpoint or feed, well inside MISO's guidance and each publisher's.
#
# Alpaca needs keys even for market data: a throwaway paper account's, in the
# repository secrets ALPACA_PAPER_KEY_ID and ALPACA_PAPER_SECRET_KEY (paper money
# only, nobody's real account). Without them the Alpaca step checks the
# repository's recordings instead.
on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC (09:17 EST)
  workflow_dispatch:
    inputs:
      alpaca_fixtures:
        description: "Also record a fresh set of Alpaca fixtures for the repository (synthetic prices, sample stories) as an artifact"
        type: boolean
        default: false
      paper_orders:
        description: "Also place, replace and cancel one order that cannot fill on the CI paper account, through the order desk"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Record live responses
        run: cargo run -p mt-miso --example capture_fixtures -- "$RUNNER_TEMP/live"
      - name: Record live weather
        run: cargo run -p mt-nws --example capture_weather -- "$RUNNER_TEMP/live"
      - name: Record live gas prices
        run: cargo run -p mt-eia --example capture_gas -- "$RUNNER_TEMP/live"
      - name: Record live news feeds
        run: cargo run -p mt-news --example capture_news -- --verbatim "$RUNNER_TEMP/live"
      - name: Record live Alpaca data
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "::warning::No Alpaca keys in this repository's secrets; checking the recorded fixtures instead"
            cp -r fixtures/data.alpaca.markets fixtures/paper-api.alpaca.markets fixtures/stream.data.alpaca.markets "$RUNNER_TEMP/live/"
          else
            cargo run -p mt-alpaca --example capture_alpaca -- --verbatim "$RUNNER_TEMP/live"
          fi
      - name: Parse them
        run: MT_FIXTURES="$RUNNER_TEMP/live" cargo test -p mt-miso -p mt-nws -p mt-eia -p mt-news -p mt-alpaca --test parsers
      # Keep the recording when something fails, to tell a real format change
      # from a transient (an odd response, a report not published yet). Not
      # Alpaca's: its market data is licensed to the account holder.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-recording
          path: |
            ${{ runner.temp }}/live
            !${{ runner.temp }}/live/data.alpaca.markets
            !${{ runner.temp }}/live/paper-api.alpaca.markets
            !${{ runner.temp }}/live/stream.data.alpaca.markets
          retention-days: 14

  # A failure becomes an issue labelled `source` (or a comment on the open
  # one), so a format change is tracked like any bug instead of waiting in the
  # Actions tab.
  report:
    needs: drift
    if: failure() && needs.drift.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Format drift: a live source failed its parser check"
        run: |
          gh label create source --color d93f0b --description "A data source changed format or stopped answering" --force
          open=$(gh issue list --label source --state open --json number,title --jq 'map(select(.title == $ENV.TITLE))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label source --body "The weekly drift job failed: $RUN_URL

          A live response no longer parses, or a source did not answer. The run's \`live-recording\` artifact (kept 14 days) holds what was recorded. Re-run the job to tell a transient from a real change; if it fails again, re-record with the source's capture example and see which parser test fails (docs/EXTENDING.md, \"When MISO changes a format\"). The fix ships as a patch release. Close this issue once it is fixed; the next failure opens a new one."
          fi

  # Run by hand: fixtures for the repository, recorded with the CI account's
  # keys and rewritten as sample copies (no licensed prices, no stories' text).
  # Download the artifact and copy its folders into fixtures/.
  # After the drift job, never beside it: an account gets one stream
  # connection per endpoint (a second is refused with 406).
  alpaca-fixtures:
    needs: drift
    if: always() && github.event_name == 'workflow_dispatch' && inputs.alpaca_fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Record sample-copy fixtures
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: cargo run -p mt-alpaca --example capture_alpaca -- "$RUNNER_TEMP/fixtures"
      - name: Parse them
        run: MT_FIXTURES="$RUNNER_TEMP/fixtures" cargo test -p mt-alpaca --test parsers
      - uses: actions/upload-artifact@v7
        with:
          name: alpaca-fixtures
          path: ${{ runner.temp }}/fixtures
          retention-days: 14

  # Run by hand: the order desk against Alpaca's live paper API with the CI
  # account (paper money, nobody's real account). One order that cannot fill
  # (one XLU share at half its price) is placed, sent again under the same
  # client_order_id (Alpaca must refuse it), found by that id, replaced and
  # cancelled; the example refuses any endpoint but paper.
  paper-orders:
    needs: drift
    if: always() && github.event_name == 'workflow_dispatch' && inputs.paper_orders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Place, find, replace and cancel a paper order
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: cargo run -p mt-alpaca --example check_paper_orders
