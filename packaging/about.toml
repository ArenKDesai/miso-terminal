# cargo-about: the third-party notices that ship in the release zip
# (THIRD-PARTY-NOTICES.html, from about.hbs). Run from the repository root:
#
#   cargo about generate --locked -c packaging/about.toml -o THIRD-PARTY-NOTICES.html packaging/about.hbs
#
# CI runs it on every pull request, so a dependency under a licence missing
# here fails there rather than at release time. Add a licence only after
# checking that it lets the crate be shipped inside an AGPL-3.0 program, and
# that it is OSI-approved (https://opensource.org/licenses): code signing
# through SignPath Foundation requires that of every component. (That is why
# egui's default fonts, which include Ubuntu Light under the Ubuntu Font
# Licence, are left out; see the workspace Cargo.toml.)

# In order of preference, for crates that offer a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MPL-2.0",
]
# What is in the Windows executable: no build tools, no test-only crates, and
# not the workspace's own crates (the AGPL, in LICENSE).
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
