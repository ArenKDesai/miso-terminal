[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/miso-terminal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"  # egui 0.36 and friends
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/ArenKDesai/miso-terminal"

[workspace.dependencies]
# Internal crates
mt-core = { path = "crates/mt-core" }
mt-data = { path = "crates/mt-data" }
mt-miso = { path = "crates/mt-miso" }
mt-nws = { path = "crates/mt-nws" }
mt-eia = { path = "crates/mt-eia" }
mt-theme = { path = "crates/mt-theme" }
mt-ui = { path = "crates/mt-ui" }

# UI. egui, eframe, egui_extras, egui_plot and egui_dock move in lockstep; bump them together.
egui = "0.36"
eframe = { version = "0.36", features = ["persistence"] }
egui_extras = "0.36"
egui_plot = "0.37"
egui_dock = { version = "0.21", features = ["serde"] }

# Async + networking. native-tls means SChannel on Windows, so corporate
# TLS-inspection roots in the Windows certificate store are trusted.
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "gzip"] }
bytes = "1"
# WebSocket streams (market data, trade updates). native-tls for the same SChannel trust as reqwest.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
csv = "1.4"
# MISO publishes some daily reports (binding constraints) only as legacy .xls.
calamine = { version = "0.36", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1.1"
# Exact decimals for money (orders, positions); never f64 where an order is involved.
rust_decimal = "1.43"
# US exchanges observe daylight saving (America/New_York); MISO market time does not.
chrono-tz = "0.10"

# Plumbing
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
directories = "6"
fontdb = "0.24"
# Secrets (API keys) in the OS credential store: Windows Credential Manager.
keyring-core = "1"
windows-native-keyring-store = { version = "1.1", default-features = false }
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Line tables keep file:line backtraces while keeping target/ (and its
# incremental cache) a fraction of the size full debug info produces.
# Test builds skip incremental compilation: each test target kept its own
# ~300 MB cache, which filled the main dev machine's disk. Plain builds keep it.
[profile.test]
incremental = false

[profile.dev]
debug = "line-tables-only"

# The data path parses tens of MB of JSON a minute (the rolling five-minute
# feed); unoptimized it takes most of a minute. Optimize it in dev too. The UI
# crate stays at opt-level 0 so edit-compile cycles stay quick.
[profile.dev.package.mt-core]
opt-level = 2
[profile.dev.package.mt-data]
opt-level = 2
[profile.dev.package.mt-miso]
opt-level = 2
[profile.dev.package.mt-nws]
opt-level = 2
[profile.dev.package.mt-eia]
opt-level = 2

# egui and wgpu are painfully slow unoptimized; optimize dependencies even in dev builds.
# Their debug info is rarely useful and bloats the Windows PDB past the linker's limits.
[profile.dev.package."*"]
opt-level = 2
debug = false
