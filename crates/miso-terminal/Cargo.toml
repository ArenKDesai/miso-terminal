[package]
name = "miso-terminal"
description = "MISO Terminal: a Bloomberg-style information terminal for the Midcontinent ISO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "miso-terminal"
path = "src/main.rs"

[dependencies]
mt-core.workspace = true
mt-data.workspace = true
mt-miso.workspace = true
mt-ui.workspace = true
anyhow.workspace = true
directories.workspace = true
eframe.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
# Toast notifications for alerts, and the per-user key that names them.
tauri-winrt-notification = "0.8"
windows-registry = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
