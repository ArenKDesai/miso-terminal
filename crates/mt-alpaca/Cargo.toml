[package]
name = "mt-alpaca"
description = "Alpaca as a data source and broker: US stock and ETF snapshots, bars and live trades and quotes, the asset list, the market clock and calendar, company news, the paper account, and the order desk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
mt-core.workspace = true
mt-data.workspace = true
chrono.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# The order desk's timeouts and lookups run on the hub's runtime.
tokio.workspace = true

[dev-dependencies]
# Unreviewed approvals for the desk's tests and the live checks in examples/.
mt-core = { workspace = true, features = ["unreviewed-orders"] }

[lints]
workspace = true
