[package]
name = "mt-ui"
description = "The egui front end: workspace, command line, functions (panels), theming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
mt-core.workspace = true
mt-data.workspace = true
mt-miso.workspace = true
mt-nws.workspace = true
mt-eia.workspace = true
mt-forecast.workspace = true
mt-news.workspace = true
mt-alpaca.workspace = true
mt-theme.workspace = true
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
fontdb.workspace = true
# Already built by eframe; used to write PNG exports.
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true
# Offscreen rendering of the real app (examples/render.rs).
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
# Fonts' character maps, for the glyph coverage test (epaint already uses it).
skrifa = "0.44"

[lints]
workspace = true
