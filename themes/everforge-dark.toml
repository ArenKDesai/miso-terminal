# Generated by `cargo run -p mt-theme --example sync_everforge` from Everforge tokens v3.
# Do not edit by hand: change the tokens in the Everforge repo and re-run the sync.

[meta]
id = "everforge-dark"
name = "Everforge Dark"
dark = true
author = "Aren Desai"
description = "Neutral graphite plates, brass fittings, rust for faults, mint-neon for anything live."
source = "Everforge design tokens v3 (dist/json/everforge.json)"

[palette]
background = "#16191a"
surface = "#1e2223"
surface_alt = "#283127"
border = "#343a3a"
border_strong = "#7f8886"
text = "#d9d8d0"
text_strong = "#f2f1ea"
text_muted = "#9a9e9a"
accent = "#a7c080"
on_accent = "#16191a"
live = "#6ef0b0"
positive = "#83c092"
negative = "#e67e80"
warning = "#dbbc7f"
info = "#7fbbb3"

[chart]
series = [
    "#a7c080",
    "#dbbc7f",
    "#7fbbb3",
    "#d699b6",
    "#83c092",
    "#6ef0b0",
    "#7f8886",
    "#e67e80",
]
grid = "#343a3a"

[fuel]
