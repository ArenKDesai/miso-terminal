# Generated by `cargo run -p mt-theme --example sync_everforge` from Everforge tokens v3.
# Do not edit by hand: change the tokens in the Everforge repo and re-run the sync.

[meta]
id = "everforge-light"
name = "Everforge Light"
dark = false
author = "Aren Desai"
description = "Neutral graphite plates, brass fittings, rust for faults, mint-neon for anything live."
source = "Everforge design tokens v3 (dist/json/everforge.json)"

[palette]
background = "#eeeeea"
surface = "#f8f8f5"
surface_alt = "#e0e7d1"
border = "#cfd1cc"
border_strong = "#69716e"
text = "#25292a"
text_strong = "#101314"
text_muted = "#555d5a"
accent = "#4e6d16"
on_accent = "#f8f8f5"
live = "#086d4f"
positive = "#277157"
negative = "#b33736"
warning = "#7d5f0c"
info = "#2f6a8a"

[chart]
series = [
    "#4e6d16",
    "#7d5f0c",
    "#2f6a8a",
    "#94407a",
    "#277157",
    "#086d4f",
    "#69716e",
    "#b33736",
]
grid = "#cfd1cc"

[fuel]
coal = "#69716e"
gas = "#4e6d16"
hydro = "#277157"
imports = "#25292a"
nuclear = "#94407a"
other = "#555d5a"
solar = "#7d5f0c"
storage = "#086d4f"
wind = "#2f6a8a"

[style]
rounding = 2.0
spacing = 6.0
padding = 8.0
stroke = 1.0
shadow_offset = 2.0
chamfer = 8.0

[fonts.body]
family = "IBM Plex Sans"
weight = 400
size = 14.0

[fonts.mono]
family = "JetBrains Mono"
weight = 400
size = 13.0

[fonts.heading]
family = "Space Grotesk"
weight = 600
size = 17.0

[fonts.label]
family = "Space Grotesk"
weight = 600
size = 11.0

[fonts.readout]
family = "Space Grotesk"
weight = 500
size = 26.0
