# Amber Terminal: amber phosphor on black, monospace everywhere.
# Hand-written; a starting point for anyone who wants the classic trading-floor look.

[meta]
id = "amber-terminal"
name = "Amber Terminal"
dark = true
description = "Amber on black, monospace everything, square corners."

[palette]
background = "#000000"
surface = "#0b0b0b"
surface_alt = "#2a1c00"
border = "#262626"
border_strong = "#7a7a7a"
text = "#ffb347"
text_strong = "#ffe0a3"
text_muted = "#c7883a"
accent = "#ffb000"
on_accent = "#000000"
live = "#4cd964"
positive = "#3ddc84"
negative = "#ff5c5c"
warning = "#ffe14d"
info = "#5fb3ff"

[chart]
series = ["#ffb000", "#5fb3ff", "#3ddc84", "#ff5c5c", "#c792ea", "#ffe14d", "#2bd4d4", "#e0e0e0"]
grid = "#262626"

[fuel]
coal = "#9e9e9e"
gas = "#ff8c1a"
nuclear = "#c792ea"
wind = "#5fb3ff"
solar = "#ffe14d"
hydro = "#2bd4d4"
storage = "#3ddc84"
imports = "#e0e0e0"
other = "#c7883a"

[style]
rounding = 0.0
spacing = 4.0
padding = 6.0
stroke = 1.0
shadow_offset = 0.0

[fonts]
body = { family = "JetBrains Mono", weight = 400, size = 13.0 }
mono = { family = "JetBrains Mono", weight = 400, size = 13.0 }
heading = { family = "JetBrains Mono", weight = 700, size = 15.0 }
label = { family = "JetBrains Mono", weight = 600, size = 11.0 }
readout = { family = "JetBrains Mono", weight = 500, size = 24.0 }
