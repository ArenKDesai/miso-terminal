# MISO Terminal configuration. Every key is optional; delete one to get its default.

theme = "default"

[ui]
zoom = 1.0
price_alert = 100.0
price_extreme = 500.0
favorite_nodes = [
    "ARKANSAS.HUB",
    "ILLINOIS.HUB",
    "INDIANA.HUB",
    "LOUISIANA.HUB",
    "MICHIGAN.HUB",
    "MINN.HUB",
    "MS.HUB",
    "TEXAS.HUB",
]
favorite_securities = []
follow_system_theme = false
light_theme = "default-light"
dark_theme = "default"
notify_alerts = true
show_local_clock = true

[ui.hotkeys]
F10 = "LOG"
F2 = "HOME"
F3 = "LMP"
F4 = "MAP"
F6 = "WL"
F7 = "HUBS"
F8 = "WX"
F9 = "ALRT"

[data]
max_concurrent_requests = 4
polite_interval_secs = 55
history_days = 7
cache_max_mb = 2048
archive_days = 90

[endpoints]
public_api = "https://public-api.misoenergy.org/api"
market_reports = "https://docs.misoenergy.org/marketreports"

[news]
keep_days = 21

[markets]
feed = "iex"
stream_limit = 30

# Tables a user adds by hand, as the tutorials show: one of every alert kind,
# a news feed and topic, and a list for Q.

[[alerts]]
kind = "price_above"
node = "MINN.HUB"
value = 100.0

[[alerts]]
kind = "price_below"
node = "TEXAS.HUB"
value = -5.0

[[alerts]]
kind = "constraint_binds"
contains = "GENOA"

[[alerts]]
kind = "shadow_price_above"
value = 500.0

[[alerts]]
kind = "spread_above"
a = "MINN.HUB"
b = "ILLINOIS.HUB"
value = 25.0

[[alerts]]
kind = "transfer_above"
pct = 90.0

[[alerts]]
kind = "load_above_forecast"
pct = 3.0

[[alerts]]
kind = "ace_above"
mw = 500.0

[[alerts]]
kind = "headline_mentions"
keywords = "MISO, PJM, power prices"

[[news.feeds]]
id = "my-feed"
source = "Energy News Network"
section = "Midwest"
url = "https://example.org/feed.xml"
top = false

[[news.topics]]
name = "DATACENTERS"
description = "Data-centre load and the grid"
keywords = ["data center*", "data centre*", "hyperscale*", "AI load"]

[[markets.lists]]
name = "MINE"
title = "My utilities"
symbols = ["XEL", "WEC", "AEE", "MGEE"]
